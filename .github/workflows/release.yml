name: release

on:
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: 'Push to NuGet.org'
        required: true
        type: boolean
        default: false
      resume_tag:
        description: 'Resume a tagged release whose packages are already on GitHub Packages'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: write
      packages: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required to allocate the next monthly release revision
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Calculate release version
      id: version
      env:
        RESUME_TAG: ${{ inputs.resume_tag }}
      run: |
        python3 - <<'PY'
        import datetime
        import os
        import re
        import subprocess

        resume_tag = os.environ["RESUME_TAG"]
        if resume_tag:
            match = re.fullmatch(r"v([0-9]{2})\.([1-9]|1[0-2])\.([1-9][0-9]*)", resume_tag)
            if not match or int(match[3]) > 65534:
                raise SystemExit("Resume tag must be a valid vYY.M.REVISION tag")
            subprocess.run(["git", "checkout", "--detach", f"refs/tags/{resume_tag}"], check=True)
            version = resume_tag[1:]
        else:
            now = datetime.datetime.now(datetime.timezone.utc)
            prefix = f"{now.year % 100}.{now.month}"
            pattern = re.compile(rf"v{re.escape(prefix)}\.([1-9][0-9]*)")
            tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
            revisions = [int(match[1]) for tag in tags if (match := pattern.fullmatch(tag))]
            revision = max(revisions, default=0) + 1
            if revision > 65534:
                raise SystemExit("Monthly revision exceeds the .NET assembly version limit")
            version = f"{prefix}.{revision}"
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"version={version}\n")
        with open(os.environ["GITHUB_ENV"], "a") as environment:
            environment.write(f"VERSION={version}\n")
        print(f"Release version: {version}")
        PY
    
    - name: Restore dependencies
      run: dotnet restore hubspot.slnx
    
    - name: Build
      run: dotnet build hubspot.slnx --configuration Release --no-restore -p:Version="$VERSION"

    - name: Pack NuGet packages
      run: dotnet pack hubspot.slnx --configuration Release --no-build --output ./packages -p:Version="$VERSION"

    - name: Retrieve published GitHub packages
      if: ${{ inputs.resume_tag != '' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PACKAGE_OWNER: ${{ github.repository_owner }}
      run: |
        shopt -s nullglob
        packages=(./packages/*.nupkg)
        if (( ${#packages[@]} == 0 )); then
          echo "No packages were built" >&2
          exit 1
        fi
        for package in "${packages[@]}"; do
          filename="${package##*/}"
          package_id="${filename%."$VERSION".nupkg}"
          if [[ "$package_id" == "$filename" ]]; then
            echo "Unexpected package filename: $filename" >&2
            exit 1
          fi
          package_id="$(printf '%s' "$package_id" | tr '[:upper:]' '[:lower:]')"
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --output "$package" \
            "https://nuget.pkg.github.com/${PACKAGE_OWNER}/download/${package_id}/${VERSION}/${package_id}.${VERSION}.nupkg"
        done
        python3 - <<'PY'
        import os
        from pathlib import Path
        import subprocess
        import xml.etree.ElementTree as ET
        import zipfile

        version = os.environ["VERSION"]
        commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
        for package in Path("packages").glob("*.nupkg"):
            with zipfile.ZipFile(package) as archive:
                manifests = [name for name in archive.namelist() if name.endswith(".nuspec") and "/" not in name]
                if len(manifests) != 1:
                    raise SystemExit(f"{package.name} does not contain exactly one package manifest")
                metadata = ET.fromstring(archive.read(manifests[0])).find("{*}metadata")
                if metadata is None:
                    raise SystemExit(f"{package.name} has no package metadata")
                package_id = metadata.findtext("{*}id")
                package_version = metadata.findtext("{*}version")
                repository = metadata.find("{*}repository")
                if (not package_id or package_version != version or
                    package.name.casefold() != f"{package_id}.{version}.nupkg".casefold() or
                    repository is None or repository.get("commit") != commit):
                    raise SystemExit(f"{package.name} does not match version {version} and commit {commit}")
        PY

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-${{ steps.version.outputs.version }}
        path: ./packages/*.nupkg

    - name: Authenticate to NuGet.org
      if: ${{ inputs.push_to_nuget }}
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: damianh

    - name: Create and push tag
      if: ${{ inputs.resume_tag == '' }}
      run: |
        TAG="v$VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $VERSION"
        git push origin "refs/tags/$TAG"
    
    - name: Push to GitHub Packages
      if: ${{ inputs.resume_tag == '' }}
      run: |
        dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true
        dotnet nuget push "./packages/*.nupkg" --source "github" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
    
    - name: Push to NuGet.org
      if: ${{ inputs.push_to_nuget }}
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push "./packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

    - name: Check existing GitHub release
      if: ${{ inputs.resume_tag != '' }}
      id: existing_release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
          --header "Accept: application/vnd.github+json" \
          --header "Authorization: Bearer $GH_TOKEN" \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"
        case "$status" in
          200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
          404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
          *) echo "Checking the GitHub release failed with HTTP $status" >&2; exit 1 ;;
        esac
    
    - name: Create GitHub Release
      if: ${{ steps.existing_release.outputs.exists != 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
