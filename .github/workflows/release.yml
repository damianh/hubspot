name: release

on:
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: 'Push to NuGet.org'
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: write
      packages: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required to allocate the next monthly release revision
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Calculate release version
      id: version
      run: |
        python3 - <<'PY'
        import datetime
        import os
        import re
        import subprocess

        now = datetime.datetime.now(datetime.timezone.utc)
        prefix = f"{now.year % 100}.{now.month}"
        pattern = re.compile(rf"v{re.escape(prefix)}\.([1-9][0-9]*)")
        tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
        revisions = [int(match[1]) for tag in tags if (match := pattern.fullmatch(tag))]
        revision = max(revisions, default=0) + 1
        if revision > 65534:
            raise SystemExit("Monthly revision exceeds the .NET assembly version limit")
        version = f"{prefix}.{revision}"
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"version={version}\n")
        with open(os.environ["GITHUB_ENV"], "a") as environment:
            environment.write(f"VERSION={version}\n")
        print(f"Release version: {version}")
        PY
    
    - name: Restore dependencies
      run: dotnet restore hubspot.slnx
    
    - name: Build
      run: dotnet build hubspot.slnx --configuration Release --no-restore -p:Version="$VERSION"

    - name: Pack NuGet packages
      run: dotnet pack hubspot.slnx --configuration Release --no-build --output ./packages -p:Version="$VERSION"

    - name: Create and push tag
      run: |
        TAG="v$VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $VERSION"
        git push origin "refs/tags/$TAG"
    
    - name: Push to GitHub Packages
      run: |
        dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true
        dotnet nuget push "./packages/*.nupkg" --source "github" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
    
    - name: Push to NuGet.org
      if: ${{ inputs.push_to_nuget }}
      run: |
        dotnet nuget push "./packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_ORG_APIKEY }} --skip-duplicate
    
    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-${{ steps.version.outputs.version }}
        path: ./packages/*.nupkg
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
